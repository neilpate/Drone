[package]
name        = "firmware-drone-nrf5340-radio"
version     = "0.1.0"
description = "Drone firmware: on-target binary for the nRF5340."
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish              = false
autotests            = false
autobenches          = false
autoexamples         = false

[[bin]]
name    = "firmware-drone-nrf5340-radio"
path    = "src/main.rs"
test    = false
bench   = false
doctest = false

[dependencies]
nrf5340-ipc = { path = "../nrf5340-ipc", features = ["net"] }
embassy-executor = { workspace = true }
embassy-nrf      = { version = "0.2", features = ["nrf5340-net", "defmt", "time-driver-rtc1"] }
embassy-time     = { workspace = true }
embassy-futures  = { workspace = true }

cortex-m    = { workspace = true }
cortex-m-rt = { workspace = true }

defmt       = { workspace = true}
defmt-rtt   = { workspace = true }
panic-probe = { workspace = true }

[lints]
workspace = true
